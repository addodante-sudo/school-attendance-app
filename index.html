
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primary School Attendance</title>
  <!-- Tailwind CSS for mobile styling -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-lg">School Register</h1>
      <span class="text-xs bg-teal-800 px-2 py-1 rounded">Kumasi Edition</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 pb-20">
    <!-- Class Filter -->
    <div class="bg-white p-3 rounded-lg shadow-sm mb-4 flex justify-between items-center">
      <label for="classSelect" class="font-semibold text-sm">Select Class:</label>
      <select id="classSelect" onchange="renderRoster()" class="border border-slate-300 rounded p-1 text-sm bg-slate-50">
        <option value="Basic 1">Basic 1</option>
        <option value="Basic 2">Basic 2</option>
        <option value="Basic 3" selected>Basic 3</option>
        <option value="Basic 4">Basic 4</option>
        <option value="Basic 5">Basic 5</option>
        <option value="Basic 6">Basic 6</option>
      </select>
    </div>

    <!-- Stats Card -->
    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
      <div class="bg-emerald-100 p-2 rounded-lg border border-emerald-200">
        <div id="countPresent" class="text-xl font-bold text-emerald-700">0</div>
        <div class="text-xs text-emerald-800 font-medium">Present</div>
      </div>
      <div class="bg-amber-100 p-2 rounded-lg border border-amber-200">
        <div id="countLate" class="text-xl font-bold text-amber-700">0</div>
        <div class="text-xs text-amber-800 font-medium">Late</div>
      </div>
      <div class="bg-rose-100 p-2 rounded-lg border border-rose-200">
        <div id="countAbsent" class="text-xl font-bold text-rose-700">0</div>
        <div class="text-xs text-rose-800 font-medium">Absent</div>
      </div>
    </div>

    <!-- Student List -->
    <div id="studentList" class="space-y-2"></div>
  </main>

  <script>
    // Sample Student Roster
    const students = [
      { id: '101', name: 'Kofi Mensah', class: 'Basic 3', phone: '0241234567', status: 'present' },
      { id: '102', name: 'Ama Serwaa', class: 'Basic 3', phone: '0271234567', status: 'present' },
      { id: '103', name: 'Kwaku Dua', class: 'Basic 3', phone: '0551234567', status: 'absent' },
      { id: '104', name: 'Abena Osei', class: 'Basic 3', phone: '0201234567', status: 'late' },
      { id: '105', name: 'Yaw Owusu', class: 'Basic 3', phone: '0501234567', status: 'present' },
      { id: '106', name: 'Emmanuel Addo', class: 'Basic 1', phone: '0531411275', status: 'present' }
    ];

    function updateStatus(id, newStatus) {
      const student = students.find(s => s.id === id);
      if (student) {
        student.status = newStatus;
        renderRoster();
      }
    }

    function formatGhanaPhone(phone) {
      let cleaned = phone.replace(/\s+|-/g, '');
      if (cleaned.startsWith('0')) return '233' + cleaned.substring(1);
      return cleaned;
    }

    function sendWhatsApp(name, phone) {
      const formattedPhone = formatGhanaPhone(phone);
      const text = encodeURIComponent(`Dear Parent/Guardian, this is an official notice that your child ${name} was marked ABSENT today from school. Kindly contact the administration.`);
      window.open(`https://wa.me/${formattedPhone}?text=${text}`, '_blank');
    }

    function renderRoster() {
      const selectedClass = document.getElementById('classSelect').value;
      const listContainer = document.getElementById('studentList');
      const filtered = students.filter(s => s.class === selectedClass);

      // Recalculate Stats
      document.getElementById('countPresent').innerText = filtered.filter(s => s.status === 'present').length;
      document.getElementById('countLate').innerText = filtered.filter(s => s.status === 'late').length;
      document.getElementById('countAbsent').innerText = filtered.filter(s => s.status === 'absent').length;

      listContainer.innerHTML = '';

      filtered.forEach(s => {
        const card = document.createElement('div');
        card.className = 'bg-white p-3 rounded-lg shadow-sm flex items-center justify-between border border-slate-200';
        
        card.innerHTML = `
          <div>
            <div class="font-bold text-sm text-slate-800">${s.name}</div>
            <div class="text-xs text-slate-500">${s.phone}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="updateStatus('${s.id}', 'present')" class="px-2 py-1 text-xs rounded font-semibold ${s.status === 'present' ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">P</button>
            <button onclick="updateStatus('${s.id}', 'late')" class="px-2 py-1 text-xs rounded font-semibold ${s.status === 'late' ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}">L</button>
            <button onclick="updateStatus('${s.id}', 'absent')" class="px-2 py-1 text-xs rounded font-semibold ${s.status === 'absent' ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600'}">A</button>
            
            ${s.status === 'absent' ? `
              <button onclick="sendWhatsApp('${s.name}', '${s.phone}')" class="ml-1 p-1 bg-teal-100 text-teal-700 rounded hover:bg-teal-200">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
              </button>
            ` : ''}
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    renderRoster();
  </script>
</body>
</html>
