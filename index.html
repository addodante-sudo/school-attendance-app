<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Registry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen pb-16 transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="bg-indigo-700 dark:bg-indigo-950 text-white p-4 shadow-md sticky top-0 z-20 transition-colors">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Attendance Registry</h1>
                <p class="text-xs text-indigo-200 dark:text-indigo-300" id="current-date-display"></p>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Supabase Cloud Connection Status Indicator -->
                <div id="cloud-status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-900/60 text-indigo-200 border border-indigo-500/40">
                    <span id="cloud-status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span id="cloud-status-text" class="hidden sm:inline">Connecting...</span>
                </div>

                <!-- Dark Mode Toggle Button -->
                <button onclick="toggleDarkMode()" id="theme-toggle-btn" title="Toggle Theme"
                    class="p-2 rounded-xl bg-indigo-800 dark:bg-indigo-900 hover:bg-indigo-900 dark:hover:bg-indigo-800 text-amber-300 transition-colors border border-indigo-600 dark:border-indigo-700">
                    <span id="theme-icon">🌙</span>
                </button>

                <button onclick="openAddPupilModal()" class="bg-indigo-600 dark:bg-indigo-800 hover:bg-indigo-800 text-white text-xs px-3 py-2 rounded-xl border border-indigo-400 font-semibold transition">
                    + Add Pupil
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto p-4 space-y-4">
        
        <!-- Live Analytics Counters -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
            <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm text-center">
                <p class="text-xs font-semibold text-slate-400 dark:text-slate-400 uppercase">Total Pupils</p>
                <p id="stat-total" class="text-xl font-bold text-slate-800 dark:text-slate-100">0</p>
            </div>
            <div class="bg-emerald-50 dark:bg-emerald-950/40 p-3.5 rounded-2xl border border-emerald-100 dark:border-emerald-900/50 shadow-sm text-center">
                <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase">Present</p>
                <p id="stat-present" class="text-xl font-bold text-emerald-700 dark:text-emerald-300">0</p>
            </div>
            <div class="bg-amber-50 dark:bg-amber-950/40 p-3.5 rounded-2xl border border-amber-100 dark:border-amber-900/50 shadow-sm text-center">
                <p class="text-xs font-semibold text-amber-600 dark:text-amber-400 uppercase">Late</p>
                <p id="stat-late" class="text-xl font-bold text-amber-700 dark:text-amber-300">0</p>
            </div>
            <div class="bg-rose-50 dark:bg-rose-950/40 p-3.5 rounded-2xl border border-rose-100 dark:border-rose-900/50 shadow-sm text-center">
                <p class="text-xs font-semibold text-rose-600 dark:text-rose-400 uppercase">Absent</p>
                <p id="stat-absent" class="text-xl font-bold text-rose-700 dark:text-rose-300">0</p>
            </div>
        </div>

        <!-- Controls & Date Panel -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="grid grid-cols-2 gap-2 w-full md:w-auto">
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Class</label>
                    <select id="class-select" onchange="loadPupils()" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-xs rounded-xl p-2.5 font-semibold focus:outline-none focus:border-indigo-600">
                        <option value="Primary 1">Primary 1</option>
                        <option value="Primary 2">Primary 2</option>
                        <option value="Primary 3">Primary 3</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase mb-1">Date</label>
                    <input type="date" id="attendance-date" onchange="loadPupils()" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-xs rounded-xl p-2 font-semibold focus:outline-none focus:border-indigo-600">
                </div>
            </div>

            <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                <button onclick="markAllPresent()" class="flex-1 md:flex-none bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 dark:hover:bg-emerald-900 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 text-xs font-semibold px-3 py-2.5 rounded-xl transition">
                    ✓ All Present
                </button>
                <button onclick="exportCSV()" class="flex-1 md:flex-none bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-600 text-xs font-semibold px-3 py-2.5 rounded-xl transition">
                    📥 Export CSV
                </button>
                <button onclick="saveAttendance()" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 dark:bg-indigo-600 dark:hover:bg-indigo-500 text-white text-xs font-bold px-5 py-2.5 rounded-xl shadow-md transition">
                    💾 Save Log
                </button>
            </div>
        </div>

        <!-- Pupil List Container -->
        <div id="pupils-container" class="space-y-3"></div>

    </main>

    <!-- Modal: Register Pupil -->
    <div id="add-pupil-modal" class="fixed inset-0 bg-slate-900/80 dark:bg-black/85 backdrop-blur-sm flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 w-full max-w-md border border-slate-100 dark:border-slate-700">
            <h3 class="text-base font-bold text-slate-900 dark:text-white mb-3">Register New Pupil</h3>
            <form onsubmit="handleAddPupil(event)" class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">First Name</label>
                        <input type="text" id="new-fname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl p-2 text-xs focus:border-indigo-600 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Last Name</label>
                        <input type="text" id="new-lname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl p-2 text-xs focus:border-indigo-600 focus:outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Class</label>
                    <select id="new-class" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl p-2 text-xs font-medium focus:border-indigo-600">
                        <option value="Primary 1">Primary 1</option>
                        <option value="Primary 2">Primary 2</option>
                        <option value="Primary 3">Primary 3</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Guardian Name</label>
                    <input type="text" id="new-gname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl p-2 text-xs focus:border-indigo-600 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Guardian Phone (with country code)</label>
                    <input type="tel" id="new-gphone" placeholder="233240000000" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-800 dark:text-slate-100 rounded-xl p-2 text-xs focus:border-indigo-600 focus:outline-none">
                </div>
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeAddPupilModal()" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 text-xs py-2 rounded-xl font-semibold">Cancel</button>
                    <button type="submit" class="flex-1 bg-indigo-600 dark:bg-indigo-700 hover:bg-indigo-700 text-white text-xs py-2 rounded-xl font-bold">Save Pupil</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- DARK MODE CONTROLLER ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
        }

        initTheme();

        // --- SUPABASE & API CONFIGURATION ---
        const SUPABASE_URL = "https://lzszyolecmxbdrteik.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6c3p5b2xlY214eGJkdHJ0ZWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mjk1NzcsImV4cCI6MjEwNjAwNTU3N30.rK5UBp0Vu5Of6pFqcxVhIZMfd0e2ZXZ3ha-8oVW4bHE";
        
        let db = null;
        let pupilsData = [];
        let attendanceState = {}; 

        // Set Default Date Display
        const todayISO = new Date().toISOString().split('T')[0];
        document.getElementById('attendance-date').value = todayISO;
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('en-GB', {
            weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        });

        // Initialize Supabase & Load Registry Automatically
        async function initApp() {
            const badge = document.getElementById('cloud-status-badge');
            const dot = document.getElementById('cloud-status-dot');
            const text = document.getElementById('cloud-status-text');

            try {
                db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                const { error } = await db.from('pupils').select('id').limit(1);

                if (!error) {
                    badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-600/50";
                    dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                    text.innerText = "Cloud Active";
                } else {
                    setLocalModeBadge(badge, dot, text);
                }
            } catch (e) {
                console.warn("Cloud connection check failed, using fallback:", e);
                setLocalModeBadge(badge, dot, text);
            }

            loadPupils();
        }

        function setLocalModeBadge(badge, dot, text) {
            badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700";
            dot.className = "w-2 h-2 rounded-full bg-slate-400";
            text.innerText = "Local Mode";
        }

        // Fetch Pupils & Existing Records
        async function loadPupils() {
            const selectedClass = document.getElementById('class-select').value;
            const selectedDate = document.getElementById('attendance-date').value;
            const container = document.getElementById('pupils-container');

            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Loading attendance registry...</div>`;

            let logsMap = {};

            if (db) {
                const { data: pupils } = await db
                    .from('pupils')
                    .select('*')
                    .eq('class_name', selectedClass);

                if (pupils && pupils.length > 0) {
                    pupilsData = pupils;
                } else {
                    pupilsData = getFallbackPupils(selectedClass);
                }

                const { data: logs } = await db
                    .from('attendance_logs')
                    .select('*')
                    .eq('date', selectedDate);

                if (logs) {
                    logs.forEach(l => {
                        logsMap[l.pupil_id] = { status: l.status, remarks: l.remarks || '' };
                    });
                }
            } else {
                pupilsData = getFallbackPupils(selectedClass);
            }

            attendanceState = {};
            pupilsData.forEach(pupil => {
                const existing = logsMap[pupil.id];
                attendanceState[pupil.id] = {
                    status: existing ? existing.status : 'Present',
                    remarks: existing ? existing.remarks : ''
                };
            });

            renderPupilList();
            updateAnalytics();
        }

        // Render Pupil Cards
        function renderPupilList() {
            const container = document.getElementById('pupils-container');
            if (pupilsData.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No pupils registered in ${document.getElementById('class-select').value}.</div>`;
                return;
            }

            container.innerHTML = pupilsData.map(pupil => {
                const record = attendanceState[pupil.id] || { status: 'Present', remarks: '' };
                const status = record.status;
                const remarks = record.remarks;

                return `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3 transition-colors">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white">${pupil.first_name} ${pupil.last_name}</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Guardian: ${pupil.guardian_name} (${pupil.guardian_phone})</p>
                            </div>
                            
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <div class="inline-flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl w-full sm:w-auto justify-between">
                                    <button onclick="setStatus('${pupil.id}', 'Present')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Present' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Present
                                    </button>
                                    <button onclick="setStatus('${pupil.id}', 'Late')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Late' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Late
                                    </button>
                                    <button onclick="setStatus('${pupil.id}', 'Absent')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Absent' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Absent
                                    </button>
                                </div>

                                ${status === 'Absent' ? `
                                    <button onclick="sendWhatsAppAlert('${pupil.first_name}', '${pupil.guardian_phone}')" 
                                        title="Send WhatsApp Absent Alert" 
                                        class="bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 p-2 rounded-xl border border-emerald-200 dark:border-emerald-800 transition">
                                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 dark:border-slate-700">
                            <input type="text" value="${remarks}" placeholder="Add remark (e.g., Sick, Traffic)..."
                                onchange="setRemarks('${pupil.id}', this.value)"
                                class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                `;
            }).join('');
        }

        // State & Analytics
        function setStatus(pupilId, status) {
            attendanceState[pupilId].status = status;
            renderPupilList();
            updateAnalytics();
        }

        function setRemarks(pupilId, text) {
            attendanceState[pupilId].remarks = text;
        }

        function markAllPresent() {
            pupilsData.forEach(p => {
                attendanceState[p.id].status = 'Present';
            });
            renderPupilList();
            updateAnalytics();
        }

        function updateAnalytics() {
            const total = pupilsData.length;
            let present = 0, late = 0, absent = 0;

            Object.values(attendanceState).forEach(rec => {
                if (rec.status === 'Present') present++;
                else if (rec.status === 'Late') late++;
                else if (rec.status === 'Absent') absent++;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-late').innerText = late;
            document.getElementById('stat-absent').innerText = absent;
        }

        // Save Attendance
        async function saveAttendance() {
            const selectedDate = document.getElementById('attendance-date').value;

            if (!db) {
                alert("Attendance recorded locally!");
                return;
            }

            const records = Object.keys(attendanceState).map(pupilId => ({
                pupil_id: pupilId,
                date: selectedDate,
                status: attendanceState[pupilId].status,
                remarks: attendanceState[pupilId].remarks
            }));

            const { error } = await db
                .from('attendance_logs')
                .upsert(records, { onConflict: 'pupil_id,date' });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert(`Attendance saved for ${selectedDate}!`);
            }
        }

        // CSV Export
        function exportCSV() {
            const selectedClass = document.getElementById('class-select').value;
            const selectedDate = document.getElementById('attendance-date').value;

            let csvContent = "data:text/csv;charset=utf-8,Class,Date,Pupil Name,Guardian Name,Guardian Phone,Status,Remarks\n";

            pupilsData.forEach(p => {
                const rec = attendanceState[p.id] || { status: 'Present', remarks: '' };
                const row = `"${selectedClass}","${selectedDate}","${p.first_name} ${p.last_name}","${p.guardian_name}","${p.guardian_phone}","${rec.status}","${rec.remarks}"`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Attendance_${selectedClass.replace(' ','_')}_${selectedDate}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Pupil Modal Handlers
        function openAddPupilModal() {
            document.getElementById('add-pupil-modal').classList.remove('hidden');
        }

        function closeAddPupilModal() {
            document.getElementById('add-pupil-modal').classList.add('hidden');
        }

        async function handleAddPupil(e) {
            e.preventDefault();
            const fname = document.getElementById('new-fname').value.trim();
            const lname = document.getElementById('new-lname').value.trim();
            const className = document.getElementById('new-class').value;
            const gname = document.getElementById('new-gname').value.trim();
            const gphone = document.getElementById('new-gphone').value.trim();

            const newPupil = {
                first_name: fname,
                last_name: lname,
                class_name: className,
                guardian_name: gname,
                guardian_phone: gphone
            };

            if (db) {
                const { error } = await db.from('pupils').insert([newPupil]);
                if (error) {
                    alert("Error registering pupil: " + error.message);
                    return;
                }
            }

            alert("Pupil registered successfully!");
            closeAddPupilModal();
            loadPupils();
        }

        function getFallbackPupils(className) {
            return [
                { id: '1', first_name: 'Kwame', last_name: 'Mensa', class_name: className, guardian_name: 'Mr. Mensa', guardian_phone: '233240000001' },
                { id: '2', first_name: 'Akosua', last_name: 'Agyei', class_name: className, guardian_name: 'Mrs. Agyei', guardian_phone: '233240000002' },
                { id: '3', first_name: 'Kofi', last_name: 'Osei', class_name: className, guardian_name: 'Mad. Osei', guardian_phone: '233240000003' }
            ];
        }

        function sendWhatsAppAlert(pupilName, phone) {
            const dateVal = document.getElementById('attendance-date').value;
            const message = `Hello, this is an automated attendance notice. Please be informed that ${pupilName} was marked ABSENT today (${dateVal}). Kindly contact the school administration if you have any questions.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Initialize App on Page Load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
