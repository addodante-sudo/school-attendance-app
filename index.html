<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primary School Attendance | Addodante Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#1a7930',
              600: '#156327',
              700: '#114f1f',
              800: '#0d3d18',
              900: '#092a11',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

  <!-- Header -->
  <header class="bg-brand-600 dark:bg-brand-900 text-white p-4 shadow-md sticky top-0 z-10 transition-colors duration-200">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <!-- Logo Image -->
        <img src="logo.png" alt="Addodante Hub Logo" class="h-9 w-9 object-contain bg-white rounded-md p-0.5 shadow-sm" onerror="this.style.display='none'; document.getElementById('logoFallback').classList.remove('hidden');">
        
        <!-- Logo Fallback -->
        <div id="logoFallback" class="hidden h-9 w-9 bg-white text-brand-600 font-black text-lg flex items-center justify-center rounded-md shadow-sm">
          A
        </div>

        <div>
          <h1 class="font-bold text-base leading-tight">School Register</h1>
          <p class="text-xs text-brand-100">Powered by <span class="font-semibold text-white">ADDODANTE HUB</span></p>
        </div>
      </div>
      
      <!-- Dark Mode Toggle -->
      <button onclick="toggleDarkMode()" class="p-2 bg-brand-700 dark:bg-brand-800 hover:bg-brand-500 rounded-full transition-colors text-sm flex items-center justify-center shadow-inner">
        <span id="themeIcon">🌙</span>
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 pb-28 flex-1 w-full">
    
    <!-- Calendar & School Days Selector -->
    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm mb-4 border border-slate-200 dark:border-slate-700 transition-colors">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center gap-1">
          📅 School Calendar
        </span>
        <!-- Date Picker Input -->
        <input type="date" id="datePicker" onchange="handleDateChange(this.value)" class="border border-slate-300 dark:border-slate-600 rounded px-2 py-0.5 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white font-medium focus:outline-none focus:ring-1 focus:ring-brand-500">
      </div>

      <!-- Monday to Friday Weekday Pills -->
      <div id="weekDaysStrip" class="grid grid-cols-5 gap-1 pt-1"></div>
    </div>

    <!-- Class Filter & Add Pupil Button -->
    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm mb-4 flex justify-between items-center border border-slate-200 dark:border-slate-700 transition-colors">
      <div class="flex items-center gap-2">
        <label for="classSelect" class="font-semibold text-sm">Class:</label>
        <select id="classSelect" onchange="renderRoster()" class="border border-slate-300 dark:border-slate-600 rounded p-1 text-sm bg-slate-50 dark:bg-slate-700 dark:text-white font-medium">
          <option value="Basic 1">Basic 1</option>
          <option value="Basic 2">Basic 2</option>
          <option value="Basic 3" selected>Basic 3</option>
          <option value="Basic 4">Basic 4</option>
          <option value="Basic 5">Basic 5</option>
          <option value="Basic 6">Basic 6</option>
        </select>
      </div>

      <!-- Add Pupil Button -->
      <button onclick="openAddModal()" class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-semibold text-xs rounded-lg flex items-center gap-1 transition-all shadow-sm">
        <span class="text-sm font-bold">+</span> Add Pupil
      </button>
    </div>

    <!-- Stats Summary Card -->
    <div class="grid grid-cols-3 gap-2 mb-4 text-center">
      <div class="bg-emerald-100 dark:bg-emerald-950 p-2 rounded-lg border border-emerald-200 dark:border-emerald-800">
        <div id="countPresent" class="text-xl font-bold text-emerald-700 dark:text-emerald-300">0</div>
        <div class="text-xs text-emerald-800 dark:text-emerald-400 font-medium">Present</div>
      </div>
      <div class="bg-amber-100 dark:bg-amber-950 p-2 rounded-lg border border-amber-200 dark:border-amber-800">
        <div id="countLate" class="text-xl font-bold text-amber-700 dark:text-amber-300">0</div>
        <div class="text-xs text-amber-800 dark:text-amber-400 font-medium">Late</div>
      </div>
      <div class="bg-rose-100 dark:bg-rose-950 p-2 rounded-lg border border-rose-200 dark:border-rose-800">
        <div id="countAbsent" class="text-xl font-bold text-rose-700 dark:text-rose-300">0</div>
        <div class="text-xs text-rose-800 dark:text-rose-400 font-medium">Absent</div>
      </div>
    </div>

    <!-- Student Roster List -->
    <div id="studentList" class="space-y-2"></div>
  </main>

  <!-- Floating Toast Notification for UNDO Feature -->
  <div id="undoToast" class="hidden fixed bottom-14 left-1/2 -translate-x-1/2 w-11/12 max-w-md bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between z-50 transition-all border border-slate-700 dark:border-slate-300">
    <div class="text-xs font-medium flex items-center gap-1.5 overflow-hidden">
      <span>✏️</span>
      <span id="toastMessage" class="truncate">Marked Kofi Mensah as Absent</span>
    </div>
    <button onclick="undoLastAction()" class="ml-2 px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-lg uppercase tracking-wider transition-colors shrink-0 shadow">
      Undo
    </button>
  </div>

  <!-- Add Student Modal Dialog -->
  <div id="addStudentModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl max-w-sm w-full p-5 border border-slate-200 dark:border-slate-700 transition-colors">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-base text-slate-800 dark:text-slate-100">Add New Pupil</h2>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg font-bold">✕</button>
      </div>

      <form id="addStudentForm" onsubmit="handleAddStudent(event)">
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-300">Full Name</label>
            <input type="text" id="newName" required placeholder="e.g. Kwaku Mensah" class="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>

          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-300">Class</label>
            <select id="newClass" class="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
              <option value="Basic 1">Basic 1</option>
              <option value="Basic 2">Basic 2</option>
              <option value="Basic 3">Basic 3</option>
              <option value="Basic 4">Basic 4</option>
              <option value="Basic 5">Basic 5</option>
              <option value="Basic 6">Basic 6</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold mb-1 text-slate-600 dark:text-slate-300">Parent Phone Number</label>
            <input type="tel" id="newPhone" required placeholder="e.g. 0241234567" class="w-full border border-slate-300 dark:border-slate-600 rounded-lg p-2 text-sm bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
          </div>
        </div>

        <div class="flex justify-end gap-2 mt-5">
          <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">Cancel</button>
          <button type="submit" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-white bg-brand-600 hover:bg-brand-700 transition-colors shadow">Save Pupil</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer Developer Branding -->
  <footer class="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 py-3 text-center text-xs border-t border-slate-300 dark:border-slate-700 transition-colors">
    <div class="max-w-md mx-auto flex items-center justify-center gap-1.5">
      <span>Developed & Maintained by</span>
      <span class="font-bold text-brand-600 dark:text-brand-500">ADDODANTE HUB</span>
    </div>
  </footer>

  <script>
    // Theme setup
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    function updateThemeIcon() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
    }

    // Default Seed Roster
    const defaultStudents = [
      { id: '101', name: 'Kofi Mensah', class: 'Basic 3', phone: '0241234567' },
      { id: '102', name: 'Ama Serwaa', class: 'Basic 3', phone: '0271234567' },
      { id: '103', name: 'Kwaku Dua', class: 'Basic 3', phone: '0551234567' },
      { id: '104', name: 'Abena Osei', class: 'Basic 3', phone: '0201234567' },
      { id: '105', name: 'Yaw Owusu', class: 'Basic 3', phone: '0501234567' },
      { id: '106', name: 'Emmanuel Addo', class: 'Basic 1', phone: '0531411275' }
    ];

    // Date & Attendance Storage State
    let currentDate = new Date().toISOString().split('T')[0];
    let students = JSON.parse(localStorage.getItem('app_students')) || defaultStudents;
    let attendanceLogs = JSON.parse(localStorage.getItem('app_attendance_logs')) || {};
    
    // Undo Tracking State
    let lastAction = null;
    let toastTimer = null;

    function saveState() {
      localStorage.setItem('app_students', JSON.stringify(students));
      localStorage.setItem('app_attendance_logs', JSON.stringify(attendanceLogs));
    }

    // Get pupil status for current selected date
    function getPupilStatus(studentId) {
      if (attendanceLogs[currentDate] && attendanceLogs[currentDate][studentId]) {
        return attendanceLogs[currentDate][studentId];
      }
      return 'present'; // Default status
    }

    // Calendar & Date Handling
    function handleDateChange(newDateStr) {
      currentDate = newDateStr;
      document.getElementById('datePicker').value = currentDate;
      renderWeekStrip();
      renderRoster();
    }

    function renderWeekStrip() {
      const stripContainer = document.getElementById('weekDaysStrip');
      stripContainer.innerHTML = '';

      const curr = new Date(currentDate + 'T00:00:00');
      const dayOfWeek = curr.getDay(); // 0 is Sun, 1 is Mon...
      
      // Calculate Monday of current week
      const monday = new Date(curr);
      const diffToMonday = (dayOfWeek === 0 ? -6 : 1 - dayOfWeek);
      monday.setDate(curr.getDate() + diffToMonday);

      const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      
      for (let i = 0; i < 5; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const isoDate = d.toISOString().split('T')[0];
        const dayNum = d.getDate();
        const isSelected = (isoDate === currentDate);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.onclick = () => handleDateChange(isoDate);
        btn.className = `p-1.5 rounded-lg text-center transition-all ${
          isSelected 
            ? 'bg-brand-600 text-white font-bold shadow-md scale-105' 
            : 'bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
        }`;

        btn.innerHTML = `
          <div class="text-[10px] uppercase font-semibold ${isSelected ? 'text-brand-100' : 'text-slate-400'}">${days[i]}</div>
          <div class="text-xs font-extrabold">${dayNum}</div>
        `;
        stripContainer.appendChild(btn);
      }
    }

    // Status Update with Undo Support
    function updateStatus(id, newStatus) {
      if (!attendanceLogs[currentDate]) {
        attendanceLogs[currentDate] = {};
      }

      const pupil = students.find(s => s.id === id);
      if (!pupil) return;

      const previousStatus = getPupilStatus(id);
      
      // If same status tapped, do nothing
      if (previousStatus === newStatus && attendanceLogs[currentDate][id]) return;

      // Save to logs
      attendanceLogs[currentDate][id] = newStatus;
      saveState();

      // Set Undo Action
      lastAction = {
        studentId: id,
        studentName: pupil.name,
        previousStatus: previousStatus,
        newStatus: newStatus,
        date: currentDate
      };

      showUndoToast(`Marked ${pupil.name} as ${newStatus.toUpperCase()}`);
      renderRoster();
    }

    function showUndoToast(msg) {
      const toast = document.getElementById('undoToast');
      document.getElementById('toastMessage').innerText = msg;
      toast.classList.remove('hidden');

      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 5000); // Toast disappears after 5 seconds
    }

    function undoLastAction() {
      if (!lastAction) return;

      const { studentId, previousStatus, date } = lastAction;
      
      if (!attendanceLogs[date]) attendanceLogs[date] = {};
      attendanceLogs[date][studentId] = previousStatus;
      
      saveState();

      // Hide Toast and Clear Undo Action
      document.getElementById('undoToast').classList.add('hidden');
      lastAction = null;
      if (toastTimer) clearTimeout(toastTimer);

      renderRoster();
    }

    // Modal Controls
    function openAddModal() {
      const currentClass = document.getElementById('classSelect').value;
      document.getElementById('newClass').value = currentClass;
      document.getElementById('addStudentModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addStudentModal').classList.add('hidden');
      document.getElementById('addStudentForm').reset();
    }

    function handleAddStudent(event) {
      event.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const targetClass = document.getElementById('newClass').value;
      const phone = document.getElementById('newPhone').value.trim();

      if (!name || !phone) return;

      const newStudent = {
        id: 'STU-' + Date.now(),
        name: name,
        class: targetClass,
        phone: phone
      };

      students.push(newStudent);
      saveState();

      document.getElementById('classSelect').value = targetClass;
      closeAddModal();
      renderRoster();
    }

    function formatGhanaPhone(phone) {
      let cleaned = phone.replace(/\s+|-/g, '');
      if (cleaned.startsWith('0')) return '233' + cleaned.substring(1);
      return cleaned;
    }

    function sendWhatsApp(name, phone) {
      const formattedPhone = formatGhanaPhone(phone);
      const text = encodeURIComponent(`Dear Parent/Guardian, this is an official notice that your child ${name} was marked ABSENT today (${currentDate}) from school. Kindly contact the administration.`);
      window.open(`https://wa.me/${formattedPhone}?text=${text}`, '_blank');
    }

    function renderRoster() {
      const selectedClass = document.getElementById('classSelect').value;
      const listContainer = document.getElementById('studentList');
      const filtered = students.filter(s => s.class === selectedClass);

      let presentCount = 0;
      let lateCount = 0;
      let absentCount = 0;

      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400 dark:text-slate-500 text-xs">
            No pupils added to ${selectedClass} yet.<br>
            Tap <strong class="text-brand-600 dark:text-brand-400">+ Add Pupil</strong> to start.
          </div>
        `;
        document.getElementById('countPresent').innerText = 0;
        document.getElementById('countLate').innerText = 0;
        document.getElementById('countAbsent').innerText = 0;
        return;
      }

      filtered.forEach(s => {
        const status = getPupilStatus(s.id);

        if (status === 'present') presentCount++;
        else if (status === 'late') lateCount++;
        else if (status === 'absent') absentCount++;

        const card = document.createElement('div');
        card.className = 'bg-white dark:bg-slate-800 p-3 rounded-lg shadow-sm flex items-center justify-between border border-slate-200 dark:border-slate-700 transition-colors';
        
        card.innerHTML = `
          <div>
            <div class="font-bold text-sm text-slate-800 dark:text-slate-100">${s.name}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">${s.phone}</div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="updateStatus('${s.id}', 'present')" class="px-2.5 py-1 text-xs rounded-md font-bold transition-all ${status === 'present' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">P</button>
            <button onclick="updateStatus('${s.id}', 'late')" class="px-2.5 py-1 text-xs rounded-md font-bold transition-all ${status === 'late' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">L</button>
            <button onclick="updateStatus('${s.id}', 'absent')" class="px-2.5 py-1 text-xs rounded-md font-bold transition-all ${status === 'absent' ? 'bg-rose-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200'}">A</button>
            
            ${status === 'absent' ? `
              <button onclick="sendWhatsApp('${s.name}', '${s.phone}')" class="ml-1 p-1.5 bg-brand-100 dark:bg-brand-900 text-brand-700 dark:text-brand-300 rounded-md hover:bg-brand-200 dark:hover:bg-brand-800 transition-colors">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
              </button>
            ` : ''}
          </div>
        `;
        listContainer.appendChild(card);
      });

      // Update Counts
      document.getElementById('countPresent').innerText = presentCount;
      document.getElementById('countLate').innerText = lateCount;
      document.getElementById('countAbsent').innerText = absentCount;
    }

    // Initialize Page
    updateThemeIcon();
    document.getElementById('datePicker').value = currentDate;
    renderWeekStrip();
    renderRoster();
  </script>
</body>
</html>
