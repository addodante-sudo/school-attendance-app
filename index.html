<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Attendance Registry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

    <!-- Header Navigation -->
    <header class="bg-indigo-700 text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide">Attendance Registry</h1>
                <p class="text-xs text-indigo-200" id="current-date-display"></p>
            </div>
            <button onclick="logoutTeacher()" class="bg-indigo-800 hover:bg-indigo-900 text-xs px-3 py-1.5 rounded-lg border border-indigo-500">
                Lock App
            </button>
        </div>
    </header>

    <!-- PIN Authentication Overlay -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm text-center">
            <div class="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">🔒</div>
            <h2 class="text-lg font-bold text-slate-900">Teacher PIN Verification</h2>
            <p class="text-xs text-slate-500 mb-4">Enter your 4-digit staff PIN to access attendance logs.</p>
            
            <input type="password" id="teacher-pin" maxlength="4" placeholder="••••" 
                class="w-full text-center text-2xl tracking-widest border-2 border-slate-200 rounded-xl py-2 mb-4 focus:border-indigo-600 focus:outline-none">
            
            <button onclick="authenticateTeacher()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl transition">
                Authenticate
            </button>
            <p id="auth-error" class="text-xs text-red-500 mt-2 hidden">Invalid PIN. Please try again.</p>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto p-4 space-y-4">
        
        <!-- Controls & Bulk Actions Bar -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="w-full sm:w-auto">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Select Class</label>
                <select id="class-select" onchange="loadPupils()" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl p-2.5 font-medium focus:outline-none focus:border-indigo-600">
                    <option value="Primary 1">Primary 1</option>
                    <option value="Primary 2">Primary 2</option>
                    <option value="Primary 3">Primary 3</option>
                </select>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="markAllPresent()" class="flex-1 sm:flex-none bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-semibold px-4 py-2.5 rounded-xl transition">
                    ✓ Mark All Present
                </button>
                <button onclick="saveAttendance()" class="flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow-md transition">
                    Save Log
                </button>
            </div>
        </div>

        <!-- Pupil List Container -->
        <div id="pupils-container" class="space-y-3">
            <!-- Dynamic pupil cards rendered here -->
        </div>

    </main>

    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "YOUR_SUPABASE_URL_HERE";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY_HERE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- AUTHORIZED STAFF PINS ---
        // Edit or add new 4-digit PINs inside this array:
        const ALLOWED_PINS = ["2026", "5566", "7788"];

        // System state
        let currentPin = "";
        let pupilsData = [];
        let attendanceState = {}; // { pupil_id: 'Present' | 'Absent' | 'Late' }

        // Set Date Display
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('en-GB', {
            weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        });

        // 1. PIN Authentication
        function authenticateTeacher() {
            const pinInput = document.getElementById('teacher-pin').value.trim();
            
            if (ALLOWED_PINS.includes(pinInput)) {
                currentPin = pinInput;
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('teacher-pin').value = '';
                document.getElementById('auth-error').classList.add('hidden');
                loadPupils();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function logoutTeacher() {
            currentPin = "";
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        // 2. Fetch Pupils & Existing Logs from Supabase
        async function loadPupils() {
            const selectedClass = document.getElementById('class-select').value;
            const container = document.getElementById('pupils-container');
            container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Loading directory...</div>`;

            // Fetch pupils matching class
            const { data: pupils, error: pupilErr } = await db
                .from('pupils')
                .select('*')
                .eq('class_name', selectedClass);

            if (pupilErr || !pupils) {
                container.innerHTML = `<div class="text-center py-8 text-red-500 text-sm">Error loading data. Check connection.</div>`;
                return;
            }

            pupilsData = pupils;

            // Fetch today's existing attendance logs
            const todayStr = new Date().toISOString().split('T')[0];
            const { data: logs } = await db
                .from('attendance_logs')
                .select('*')
                .eq('date', todayStr);

            // Populate state
            attendanceState = {};
            pupils.forEach(pupil => {
                const existingLog = logs ? logs.find(l => l.pupil_id === pupil.id) : null;
                attendanceState[pupil.id] = existingLog ? existingLog.status : 'Present';
            });

            renderPupilList();
        }

        // 3. Render Pupils UI
        function renderPupilList() {
            const container = document.getElementById('pupils-container');
            if (pupilsData.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No pupils registered in this class.</div>`;
                return;
            }

            container.innerHTML = pupilsData.map(pupil => {
                const status = attendanceState[pupil.id];
                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h3 class="font-bold text-slate-900">${pupil.first_name} ${pupil.last_name}</h3>
                            <p class="text-xs text-slate-500">Guardian: ${pupil.guardian_name} (${pupil.guardian_phone})</p>
                        </div>
                        
                        <div class="flex items-center gap-2 w-full sm:w-auto">
                            <!-- Status Segmented Controls -->
                            <div class="inline-flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto justify-between">
                                <button onclick="setStatus('${pupil.id}', 'Present')" 
                                    class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Present' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Present
                                </button>
                                <button onclick="setStatus('${pupil.id}', 'Late')" 
                                    class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Late' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Late
                                </button>
                                <button onclick="setStatus('${pupil.id}', 'Absent')" 
                                    class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Absent' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                                    Absent
                                </button>
                            </div>

                            <!-- WhatsApp Direct Trigger -->
                            ${status === 'Absent' ? `
                                <button onclick="sendWhatsAppAlert('${pupil.first_name}', '${pupil.guardian_phone}')" 
                                    title="Send WhatsApp Absent Alert" 
                                    class="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 p-2 rounded-xl border border-emerald-200 transition">
                                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                </button>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 4. Update Status State
        function setStatus(pupilId, status) {
            attendanceState[pupilId] = status;
            renderPupilList();
        }

        function markAllPresent() {
            pupilsData.forEach(pupil => {
                attendanceState[pupil.id] = 'Present';
            });
            renderPupilList();
        }

        // 5. Commit Logs to Supabase
        async function saveAttendance() {
            const todayStr = new Date().toISOString().split('T')[0];
            const records = Object.keys(attendanceState).map(pupilId => ({
                pupil_id: pupilId,
                date: todayStr,
                status: attendanceState[pupilId],
                teacher_pin: currentPin
            }));

            const { error } = await db
                .from('attendance_logs')
                .upsert(records, { onConflict: 'pupil_id,date' });

            if (error) {
                alert("Error saving log: " + error.message);
            } else {
                alert("Attendance saved successfully!");
            }
        }

        // 6. Direct WhatsApp Message Link Generator
        function sendWhatsAppAlert(pupilName, phone) {
            const dateStr = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
            const message = `Hello, this is an automated attendance notice. Please be informed that ${pupilName} was marked ABSENT today (${dateStr}). Kindly contact the school administration if you have any questions.`;
            
            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${phone}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        }
    </script>
</body>
</html>
