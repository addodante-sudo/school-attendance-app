<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addodante Hub - Attendance Registry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#1a7930', /* Addodante Hub Primary Green */
                            600: '#156327',
                            700: '#104d1e',
                            800: '#0c3816',
                            900: '#07220d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- Addodante Hub Icon Badge -->
                <div class="bg-brand-500 text-white p-2.5 rounded-2xl font-bold text-lg shadow-md shadow-brand-500/20 flex items-center justify-center">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-xs font-bold uppercase tracking-wider text-brand-500 dark:text-emerald-400">Addodante Hub</span>
                    </div>
                    <h1 class="text-lg font-bold leading-tight text-slate-900 dark:text-white">Attendance Registry</h1>
                    <p id="current-date-display" class="text-xs text-slate-500 dark:text-slate-400">Loading date...</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Cloud Status Badge -->
                <div id="cloud-status-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600">
                    <span id="cloud-status-dot" class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span id="cloud-status-text" class="text-[10px] sm:text-xs">Connecting...</span>
                </div>

                <!-- Theme Toggle Button -->
                <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 transition">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- Controls Section (Class & Date Selector) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 transition-colors">
            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Select Class</label>
                <select id="class-select" onchange="loadPupils()" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <option value="Basic 1">Basic 1</option>
                    <option value="Basic 2">Basic 2</option>
                    <option value="Basic 3">Basic 3</option>
                    <option value="Basic 4">Basic 4</option>
                    <option value="Basic 5">Basic 5</option>
                    <option value="Basic 6">Basic 6</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Select Date</label>
                <input type="date" id="attendance-date" onchange="loadPupils()" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white font-medium focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
        </div>

        <!-- Attendance Summary Metrics -->
        <div class="grid grid-cols-4 gap-2 sm:gap-4">
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-700 text-center shadow-sm">
                <span class="block text-xs text-slate-500 dark:text-slate-400 font-medium">Total</span>
                <span id="stat-total" class="text-lg sm:text-2xl font-extrabold text-slate-900 dark:text-white">0</span>
            </div>
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-emerald-200 dark:border-emerald-900/50 text-center shadow-sm bg-emerald-50/30 dark:bg-emerald-950/20">
                <span class="block text-xs text-emerald-600 dark:text-emerald-400 font-medium">Present</span>
                <span id="stat-present" class="text-lg sm:text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">0</span>
            </div>
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-amber-200 dark:border-amber-900/50 text-center shadow-sm bg-amber-50/30 dark:bg-amber-950/20">
                <span class="block text-xs text-amber-600 dark:text-amber-400 font-medium">Late</span>
                <span id="stat-late" class="text-lg sm:text-2xl font-extrabold text-amber-600 dark:text-amber-400">0</span>
            </div>
            <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-rose-200 dark:border-rose-900/50 text-center shadow-sm bg-rose-50/30 dark:bg-rose-950/20">
                <span class="block text-xs text-rose-600 dark:text-rose-400 font-medium">Absent</span>
                <span id="stat-absent" class="text-lg sm:text-2xl font-extrabold text-rose-600 dark:text-rose-400">0</span>
            </div>
        </div>

        <!-- Quick Action Bar -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button onclick="markAllPresent()" class="px-3.5 py-2 text-xs font-semibold bg-emerald-100 dark:bg-emerald-900/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-200 rounded-xl transition">
                    ✓ Mark All Present
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openAddPupilModal()" class="px-3.5 py-2 text-xs font-semibold bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-emerald-300 hover:bg-brand-100 rounded-xl transition border border-brand-200 dark:border-brand-800">
                    + Add Pupil
                </button>
                <button onclick="exportCSV()" class="px-3.5 py-2 text-xs font-semibold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 rounded-xl transition">
                    📥 CSV
                </button>
                <button onclick="saveAttendance()" class="px-4 py-2 text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white rounded-xl shadow-md shadow-brand-500/20 transition">
                    Save Attendance
                </button>
            </div>
        </div>

        <!-- Pupil List Container -->
        <div id="pupils-container" class="space-y-3">
            <div class="text-center py-8 text-slate-400 text-sm">Loading attendance registry...</div>
        </div>
    </main>

    <!-- Add Pupil Modal -->
    <div id="add-pupil-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-700 pb-3">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold text-brand-500 uppercase tracking-wider">Addodante Hub</span>
                    <span class="text-slate-300 dark:text-slate-600">•</span>
                    <h3 class="font-bold text-slate-900 dark:text-white">Register Pupil</h3>
                </div>
                <button onclick="closeAddPupilModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form onsubmit="handleAddPupil(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">First Name</label>
                    <input type="text" id="new-fname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Last Name</label>
                    <input type="text" id="new-lname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Class</label>
                    <select id="new-class" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                        <option value="Basic 1">Basic 1</option>
                        <option value="Basic 2">Basic 2</option>
                        <option value="Basic 3">Basic 3</option>
                        <option value="Basic 4">Basic 4</option>
                        <option value="Basic 5">Basic 5</option>
                        <option value="Basic 6">Basic 6</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Guardian Name</label>
                    <input type="text" id="new-gname" required class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Guardian Phone (e.g. 233240000000)</label>
                    <input type="tel" id="new-gphone" required placeholder="233240000000" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddPupilModal()" class="px-4 py-2 text-xs font-semibold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-bold bg-brand-500 hover:bg-brand-600 text-white rounded-xl shadow-md">Save Pupil</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- DARK MODE CONTROLLER ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-icon').innerText = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-icon').innerText = '🌙';
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').innerText = isDark ? '☀️' : '🌙';
        }

        initTheme();

        // --- UPDATED SUPABASE CONFIGURATION ---
        const SUPABASE_URL = "https://lzszyolecmxxbdtrteik.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx6c3p5b2xlY214eGJkdHJ0ZWlrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Mjk1NzcsImV4cCI6MjEwNjAwNTU3N30.rK5UBp0Vu5Of6pFqcxVhIZMfd0e2ZXZ3ha-8oVW4bHE";
        
        let db = null;
        let pupilsData = [];
        let attendanceState = {}; 

        // Set Default Date Display
        const todayISO = new Date().toISOString().split('T')[0];
        document.getElementById('attendance-date').value = todayISO;
        document.getElementById('current-date-display').innerText = new Date().toLocaleDateString('en-GB', {
            weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
        });

        // Startup Initialization
        async function initApp() {
            try {
                if (window.supabase) {
                    db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                }
            } catch (e) {
                console.warn("Supabase init error:", e);
            }

            // Immediately load cached or remote pupil data
            loadPupils();

            // Background connection check
            checkConnectionStatus();
        }

        async function checkConnectionStatus() {
            const badge = document.getElementById('cloud-status-badge');
            const dot = document.getElementById('cloud-status-dot');
            const text = document.getElementById('cloud-status-text');

            if (!db) {
                setLocalModeBadge(badge, dot, text);
                return;
            }

            try {
                const { error } = await db.from('pupils').select('id').limit(1);
                if (!error) {
                    badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-950/80 text-emerald-300 border border-emerald-600/50";
                    dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                    text.innerText = "Cloud Active";
                } else {
                    setLocalModeBadge(badge, dot, text);
                }
            } catch (e) {
                setLocalModeBadge(badge, dot, text);
            }
        }

        function setLocalModeBadge(badge, dot, text) {
            badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700";
            dot.className = "w-2 h-2 rounded-full bg-slate-400";
            text.innerText = "Local Mode";
        }

        // Parallel Fetching with Instant Local Cache
        async function loadPupils() {
            const selectedClass = document.getElementById('class-select').value;
            const selectedDate = document.getElementById('attendance-date').value;
            const container = document.getElementById('pupils-container');

            // 1. Instantly display cached pupils if available
            const cacheKey = `cache_pupils_${selectedClass}`;
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                pupilsData = JSON.parse(cached);
                pupilsData.forEach(p => {
                    if (!attendanceState[p.id]) {
                        attendanceState[p.id] = { status: 'Present', remarks: '' };
                    }
                });
                renderPupilList();
                updateAnalytics();
            } else {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">Loading attendance registry...</div>`;
            }

            // 2. Query Supabase in PARALLEL
            if (db) {
                try {
                    const [pupilsRes, logsRes] = await Promise.all([
                        db.from('pupils').select('*').eq('class_name', selectedClass),
                        db.from('attendance_logs').select('*').eq('date', selectedDate)
                    ]);

                    if (pupilsRes.data && pupilsRes.data.length > 0) {
                        pupilsData = pupilsRes.data;
                        localStorage.setItem(cacheKey, JSON.stringify(pupilsData));
                    } else if (!cached) {
                        pupilsData = getFallbackPupils(selectedClass);
                    }

                    let logsMap = {};
                    if (logsRes.data) {
                        logsRes.data.forEach(l => {
                            logsMap[l.pupil_id] = { status: l.status, remarks: l.remarks || '' };
                        });
                    }

                    attendanceState = {};
                    pupilsData.forEach(pupil => {
                        const existing = logsMap[pupil.id];
                        attendanceState[pupil.id] = {
                            status: existing ? existing.status : 'Present',
                            remarks: existing ? existing.remarks : ''
                        };
                    });

                    renderPupilList();
                    updateAnalytics();
                } catch (err) {
                    console.error("Parallel fetch error:", err);
                }
            } else if (!cached) {
                pupilsData = getFallbackPupils(selectedClass);
                renderPupilList();
                updateAnalytics();
            }
        }

        // Render Pupil Cards
        function renderPupilList() {
            const container = document.getElementById('pupils-container');
            if (pupilsData.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 text-sm">No pupils registered in ${document.getElementById('class-select').value}.</div>`;
                return;
            }

            container.innerHTML = pupilsData.map(pupil => {
                const record = attendanceState[pupil.id] || { status: 'Present', remarks: '' };
                const status = record.status;
                const remarks = record.remarks;

                return `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 space-y-3 transition-colors">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white">${pupil.first_name} ${pupil.last_name}</h3>
                                <p class="text-xs text-slate-500 dark:text-slate-400">Guardian: ${pupil.guardian_name} (${pupil.guardian_phone})</p>
                            </div>
                            
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <div class="inline-flex bg-slate-100 dark:bg-slate-700 p-1 rounded-xl w-full sm:w-auto justify-between">
                                    <button onclick="setStatus('${pupil.id}', 'Present')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Present' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Present
                                    </button>
                                    <button onclick="setStatus('${pupil.id}', 'Late')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Late' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Late
                                    </button>
                                    <button onclick="setStatus('${pupil.id}', 'Absent')" 
                                        class="px-3 py-1.5 text-xs font-semibold rounded-lg transition ${status === 'Absent' ? 'bg-rose-600 text-white shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}">
                                        Absent
                                    </button>
                                </div>

                                ${status === 'Absent' ? `
                                    <button onclick="sendWhatsAppAlert('${pupil.first_name}', '${pupil.guardian_phone}')" 
                                        title="Send WhatsApp Absent Alert" 
                                        class="bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 text-emerald-600 dark:text-emerald-400 p-2 rounded-xl border border-emerald-200 dark:border-emerald-800 transition">
                                        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                                    </button>
                                ` : ''}
                            </div>
                        </div>

                        <div class="pt-2 border-t border-slate-100 dark:border-slate-700">
                            <input type="text" value="${remarks}" placeholder="Add remark (e.g., Sick, Traffic)..."
                                onchange="setRemarks('${pupil.id}', this.value)"
                                class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-brand-500">
                        </div>
                    </div>
                `;
            }).join('');
        }

        // State & Analytics
        function setStatus(pupilId, status) {
            attendanceState[pupilId].status = status;
            renderPupilList();
            updateAnalytics();
        }

        function setRemarks(pupilId, text) {
            attendanceState[pupilId].remarks = text;
        }

        function markAllPresent() {
            pupilsData.forEach(p => {
                attendanceState[p.id].status = 'Present';
            });
            renderPupilList();
            updateAnalytics();
        }

        function updateAnalytics() {
            const total = pupilsData.length;
            let present = 0, late = 0, absent = 0;

            Object.values(attendanceState).forEach(rec => {
                if (rec.status === 'Present') present++;
                else if (rec.status === 'Late') late++;
                else if (rec.status === 'Absent') absent++;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-present').innerText = present;
            document.getElementById('stat-late').innerText = late;
            document.getElementById('stat-absent').innerText = absent;
        }

        // Save Attendance
        async function saveAttendance() {
            const selectedDate = document.getElementById('attendance-date').value;

            if (!db) {
                alert("Attendance recorded locally!");
                return;
            }

            const records = Object.keys(attendanceState).map(pupilId => ({
                pupil_id: pupilId,
                date: selectedDate,
                status: attendanceState[pupilId].status,
                remarks: attendanceState[pupilId].remarks
            }));

            const { error } = await db
                .from('attendance_logs')
                .upsert(records, { onConflict: 'pupil_id,date' });

            if (error) {
                alert("Error saving: " + error.message);
            } else {
                alert(`Attendance saved for ${selectedDate}!`);
            }
        }

        // CSV Export
        function exportCSV() {
            const selectedClass = document.getElementById('class-select').value;
            const selectedDate = document.getElementById('attendance-date').value;

            let csvContent = "data:text/csv;charset=utf-8,Class,Date,Pupil Name,Guardian Name,Guardian Phone,Status,Remarks\n";

            pupilsData.forEach(p => {
                const rec = attendanceState[p.id] || { status: 'Present', remarks: '' };
                const row = `"${selectedClass}","${selectedDate}","${p.first_name} ${p.last_name}","${p.guardian_name}","${p.guardian_phone}","${rec.status}","${rec.remarks}"`;
                csvContent += row + "\n";
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `AddodanteHub_Attendance_${selectedClass.replace(' ','_')}_${selectedDate}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Pupil Modal Handlers
        function openAddPupilModal() {
            document.getElementById('add-pupil-modal').classList.remove('hidden');
        }

        function closeAddPupilModal() {
            document.getElementById('add-pupil-modal').classList.add('hidden');
        }

        async function handleAddPupil(e) {
            e.preventDefault();
            const fname = document.getElementById('new-fname').value.trim();
            const lname = document.getElementById('new-lname').value.trim();
            const className = document.getElementById('new-class').value;
            const gname = document.getElementById('new-gname').value.trim();
            const gphone = document.getElementById('new-gphone').value.trim();

            const newPupil = {
                first_name: fname,
                last_name: lname,
                class_name: className,
                guardian_name: gname,
                guardian_phone: gphone
            };

            if (db) {
                const { error } = await db.from('pupils').insert([newPupil]);
                if (error) {
                    alert("Error registering pupil: " + error.message);
                    return;
                }
            }

            alert("Pupil registered successfully!");
            closeAddPupilModal();
            loadPupils();
        }

        function getFallbackPupils(className) {
            return [
                { id: '1', first_name: 'Kwame', last_name: 'Mensa', class_name: className, guardian_name: 'Mr. Mensa', guardian_phone: '233240000001' },
                { id: '2', first_name: 'Akosua', last_name: 'Agyei', class_name: className, guardian_name: 'Mrs. Agyei', guardian_phone: '233240000002' },
                { id: '3', first_name: 'Kofi', last_name: 'Osei', class_name: className, guardian_name: 'Mad. Osei', guardian_phone: '233240000003' }
            ];
        }

        function sendWhatsAppAlert(pupilName, phone) {
            const dateVal = document.getElementById('attendance-date').value;
            const message = `Hello, this is an automated attendance notice from Addodante Hub. Please be informed that ${pupilName} was marked ABSENT today (${dateVal}). Kindly contact the school administration if you have any questions.`;
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
        }

        // Initialize App on Page Load
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
