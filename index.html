<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addodante School Registry</title>
  
  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#1a7930',
              600: '#156327',
              700: '#114f1f',
              800: '#0d3d18',
              900: '#092a11',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col">

  <!-- ================= 1. SECURE PIN LOGIN OVERLAY ================= -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6">
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-brand-500/20 text-brand-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-brand-500/30 text-2xl shadow-lg">
        🔒
      </div>
      <h2 class="text-xl font-bold text-white tracking-tight">Teacher Authentication</h2>
      <p class="text-xs text-slate-400 mt-1">Enter 4-digit security PIN to access register</p>
    </div>

    <!-- PIN DISPLAY DOTS -->
    <div class="flex gap-3 mb-4">
      <div id="dot0" class="w-4 h-4 rounded-full border border-slate-600 bg-slate-800 transition-all"></div>
      <div id="dot1" class="w-4 h-4 rounded-full border border-slate-600 bg-slate-800 transition-all"></div>
      <div id="dot2" class="w-4 h-4 rounded-full border border-slate-600 bg-slate-800 transition-all"></div>
      <div id="dot3" class="w-4 h-4 rounded-full border border-slate-600 bg-slate-800 transition-all"></div>
    </div>

    <div id="pinError" class="text-rose-400 text-xs font-semibold mb-4 h-5 text-center px-4"></div>

    <!-- KEYPAD -->
    <div class="grid grid-cols-3 gap-3.5 w-64">
      <button onclick="pressPinKey('1')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">1</button>
      <button onclick="pressPinKey('2')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">2</button>
      <button onclick="pressPinKey('3')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">3</button>
      <button onclick="pressPinKey('4')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">4</button>
      <button onclick="pressPinKey('5')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">5</button>
      <button onclick="pressPinKey('6')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">6</button>
      <button onclick="pressPinKey('7')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">7</button>
      <button onclick="pressPinKey('8')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">8</button>
      <button onclick="pressPinKey('9')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">9</button>
      <div></div>
      <button onclick="pressPinKey('0')" class="h-12 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xl font-semibold text-white border border-slate-700 active:scale-95 transition-all">0</button>
      <button onclick="clearPin()" class="h-12 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 font-semibold border border-rose-500/30 text-xs active:scale-95 transition-all">Clear</button>
    </div>
  </div>

  <!-- ================= 2. HEADER ================= -->
  <header class="bg-brand-600 text-white p-3.5 shadow-md sticky top-0 z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-base leading-tight tracking-tight">School Registry</h1>
        <p class="text-[10px] text-brand-50">by <strong>ADDODANTE HUB</strong></p>
      </div>
      
      <button onclick="logoutTeacher()" class="px-2.5 py-1 bg-brand-800 hover:bg-brand-700 text-white border border-brand-700 rounded-lg text-xs font-semibold shadow-sm transition-all">
        🔒 Logout
      </button>
    </div>
  </header>

  <!-- ================= 3. ACTIVE TEACHER BAR ================= -->
  <div class="max-w-md mx-auto w-full px-3.5 pt-3">
    <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2">
        <span class="text-base">👤</span>
        <div>
          <p class="text-[10px] uppercase font-bold text-slate-400">Teacher</p>
          <p id="activeTeacherText" class="text-xs font-extrabold text-brand-600 dark:text-brand-400">--</p>
        </div>
      </div>
      <span id="activeClassTag" class="text-[10px] font-extrabold bg-brand-600 text-white px-2 py-0.5 rounded-md">--</span>
    </div>
  </div>

  <!-- ================= 4. MAIN APP BODY ================= -->
  <main class="max-w-md mx-auto p-3.5 pb-20 flex-1 w-full space-y-3">
    
    <!-- Controls Panel -->
    <div class="bg-white dark:bg-slate-800 p-3 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400">📅 Date:</label>
        <input type="date" id="datePicker" onchange="loadPupils()" class="border rounded px-2 py-1 text-xs font-semibold bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white border-slate-200 dark:border-slate-600">
      </div>

      <div class="flex items-center justify-between gap-2 border-t pt-2 border-slate-100 dark:border-slate-700">
        <label class="text-xs font-bold text-slate-500 dark:text-slate-400">Class:</label>
        <select id="classSelect" onchange="loadPupils()" class="border rounded-lg p-1.5 text-xs font-bold bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white border-slate-200 dark:border-slate-600 flex-1">
          <option value="Basic 1">Basic 1</option>
          <option value="Basic 2">Basic 2</option>
          <option value="Basic 3">Basic 3</option>
          <option value="Basic 4">Basic 4</option>
          <option value="Basic 5">Basic 5</option>
          <option value="Basic 6">Basic 6</option>
        </select>
      </div>
    </div>

    <!-- Instant Search Input Bar -->
    <div class="relative">
      <input 
        type="text" 
        id="searchInput" 
        oninput="filterPupils()" 
        placeholder="🔍 Search pupil name..." 
        class="w-full border border-slate-200 dark:border-slate-700 rounded-xl px-3 py-2 text-xs bg-white dark:bg-slate-800 text-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500 shadow-sm"
      >
    </div>

    <!-- Add New Pupil Action Button -->
    <button onclick="openAddPupilModal()" class="w-full py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow-sm hover:bg-brand-700 active:scale-95 transition-all flex items-center justify-center gap-1">
      <span>➕</span> Add New Pupil
    </button>

    <!-- Pupil Roster List Container -->
    <div id="studentList" class="space-y-2">
      <p class="text-xs text-center text-slate-400 py-4">Select a class to load pupils...</p>
    </div>

  </main>

  <!-- ================= 5. ADD PUPIL MODAL ================= -->
  <div id="addPupilModal" class="hidden fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-xl max-w-sm w-full p-5 border border-slate-200 dark:border-slate-700">
      <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 mb-3">Add New Pupil</h3>
      
      <form onsubmit="handleAddPupil(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Pupil Full Name</label>
          <input type="text" id="newPupilName" required placeholder="e.g. Kwame Mensah" class="w-full border rounded-lg p-2 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white border-slate-200 dark:border-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-500">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Assign Class</label>
          <select id="newPupilClass" class="w-full border rounded-lg p-2 text-xs bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-white border-slate-200 dark:border-slate-600 font-bold">
            <option value="Basic 1">Basic 1</option>
            <option value="Basic 2">Basic 2</option>
            <option value="Basic 3">Basic 3</option>
            <option value="Basic 4">Basic 4</option>
            <option value="Basic 5">Basic 5</option>
            <option value="Basic 6">Basic 6</option>
          </select>
        </div>

        <div id="addPupilError" class="text-rose-500 text-xs font-semibold"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAddPupilModal()" class="px-3 py-1.5 text-xs bg-slate-100 dark:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 font-semibold">Cancel</button>
          <button type="submit" class="px-4 py-1.5 text-xs bg-brand-600 text-white font-bold rounded-lg hover:bg-brand-700 shadow-sm transition-all">Save Pupil</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ================= 6. JAVASCRIPT LOGIC ================= -->
  <script>
    // Replace with your actual credentials from Supabase Dashboard > Settings > API
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeTeacher = null;
    let enteredPin = "";
    let loadedPupils = [];

    // Set today's date in datePicker by default
    document.getElementById('datePicker').value = new Date().toISOString().split('T')[0];

    // --- KEYPAD & AUTHENTICATION LOGIC ---
    function pressPinKey(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
      }
      if (enteredPin.length === 4) {
        verifyTeacherPin(enteredPin);
      }
    }

    function clearPin() {
      enteredPin = "";
      document.getElementById('pinError').innerText = "";
      updatePinDots();
    }

    function updatePinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById(`dot${i}`);
        dot.className = i < enteredPin.length 
          ? 'w-4 h-4 rounded-full bg-emerald-400 border border-emerald-400 shadow' 
          : 'w-4 h-4 rounded-full border border-slate-600 bg-slate-800';
      }
    }

    async function verifyTeacherPin(pin) {
      const errBox = document.getElementById('pinError');
      errBox.innerText = "Authenticating...";

      try {
        const { data: teacher, error } = await supabaseClient
          .from('teachers')
          .select('*')
          .eq('pin', pin)
          .single();

        if (error || !teacher) {
          throw new Error("Invalid PIN. Access denied.");
        }

        activeTeacher = teacher;
        sessionStorage.setItem('active_teacher', JSON.stringify(teacher));

        document.getElementById('loginModal').classList.add('hidden');
        applySession();
      } catch (err) {
        errBox.innerText = err.message;
        setTimeout(clearPin, 800);
      }
    }

    function applySession() {
      if (!activeTeacher) return;
      document.getElementById('activeTeacherText').innerText = activeTeacher.name;
      document.getElementById('activeClassTag').innerText = activeTeacher.class_assigned || 'ALL';

      const select = document.getElementById('classSelect');
      if (activeTeacher.class_assigned && activeTeacher.class_assigned !== 'ALL') {
        select.value = activeTeacher.class_assigned;
        select.disabled = true; // Restrict standard teachers to their assigned class
      } else {
        select.disabled = false; // Admins can switch between classes
      }

      loadPupils();
    }

    function logoutTeacher() {
      activeTeacher = null;
      sessionStorage.removeItem('active_teacher');
      clearPin();
      document.getElementById('loginModal').classList.remove('hidden');
    }

    // --- PUPIL DATA & SEARCH LOGIC ---
    async function loadPupils() {
      const selectedClass = document.getElementById('classSelect').value;
      const studentList = document.getElementById('studentList');
      
      document.getElementById('searchInput').value = '';
      studentList.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">Loading pupils...</p>';

      const { data: pupils, error } = await supabaseClient
        .from('pupils')
        .select('*')
        .eq('class', selectedClass);

      if (error) {
        studentList.innerHTML = '<p class="text-xs text-center text-rose-500 py-4">Failed to load pupils.</p>';
        return;
      }

      loadedPupils = pupils || [];
      renderPupils(loadedPupils);
    }

    function renderPupils(pupilsToDisplay) {
      const studentList = document.getElementById('studentList');

      if (pupilsToDisplay.length === 0) {
        studentList.innerHTML = '<p class="text-xs text-center text-slate-400 py-4">No pupils found.</p>';
        return;
      }

      studentList.innerHTML = '';
      pupilsToDisplay.forEach(pupil => {
        studentList.innerHTML += `
          <div class="flex justify-between items-center p-3 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <span class="font-bold text-xs">${pupil.name}</span>
            <div class="flex gap-1">
              <button onclick="markAttendance(${pupil.id}, 'Present')" class="px-2.5 py-1 bg-emerald-500 text-white rounded-lg text-xs font-bold active:scale-95 shadow-sm">P</button>
              <button onclick="markAttendance(${pupil.id}, 'Late')" class="px-2.5 py-1 bg-amber-500 text-white rounded-lg text-xs font-bold active:scale-95 shadow-sm">L</button>
              <button onclick="markAttendance(${pupil.id}, 'Absent')" class="px-2.5 py-1 bg-rose-500 text-white rounded-lg text-xs font-bold active:scale-95 shadow-sm">A</button>
            </div>
          </div>
        `;
      });
    }

    function filterPupils() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = loadedPupils.filter(pupil => 
        pupil.name.toLowerCase().includes(query)
      );
      renderPupils(filtered);
    }

    async function markAttendance(pupilId, status) {
      const today = document.getElementById('datePicker').value;

      const { error } = await supabaseClient
        .from('attendance')
        .upsert([{ pupil_id: pupilId, date: today, status: status }], { onConflict: 'pupil_id, date' });

      if (error) {
        alert("Failed to save mark: " + error.message);
      } else {
        alert(`Marked ${status}!`);
      }
    }

    // --- ADD PUPIL MODAL FUNCTIONS ---
    function openAddPupilModal() {
      const currentClass = document.getElementById('classSelect').value;
      if (currentClass) {
        document.getElementById('newPupilClass').value = currentClass;
      }
      document.getElementById('newPupilName').value = '';
      document.getElementById('addPupilError').innerText = '';
      document.getElementById('addPupilModal').classList.remove('hidden');
    }

    function closeAddPupilModal() {
      document.getElementById('addPupilModal').classList.add('hidden');
    }

    async function handleAddPupil(e) {
      e.preventDefault();
      const name = document.getElementById('newPupilName').value.trim();
      const pupilClass = document.getElementById('newPupilClass').value;
      const errBox = document.getElementById('addPupilError');

      if (!name) return;

      errBox.innerText = 'Saving...';

      const { error } = await supabaseClient
        .from('pupils')
        .insert([{ name: name, class: pupilClass }]);

      if (error) {
        errBox.innerText = 'Failed: ' + error.message;
      } else {
        closeAddPupilModal();
        document.getElementById('classSelect').value = pupilClass;
        loadPupils();
      }
    }

    // Auto-login session restore on page refresh
    window.addEventListener('DOMContentLoaded', () => {
      const saved = sessionStorage.getItem('active_teacher');
      if (saved) {
        activeTeacher = JSON.parse(saved);
        document.getElementById('loginModal').classList.add('hidden');
        applySession();
      }
    });
  </script>
</body>
</html>
